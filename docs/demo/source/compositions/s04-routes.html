<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        /* 06 THE SYSTEM RUNNING: the run log and quarantine table (phase A), then defects caught by type (phase B).
           Every number is copied from outputs/metrics.json (see audit/facts.yaml). */
        #routes-root { position: absolute; inset: 0; }
        #routes-root .term {
          position: absolute; left: 120px; top: 236px; width: 1010px; height: 560px; border-radius: 14px;
          border: 2px solid var(--line); background: #0b131c; overflow: hidden;
        }
        #routes-root .term-bar { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 20px; border-bottom: 2px solid var(--line); }
        #routes-root .term-bar i { display: block; width: 14px; height: 14px; border-radius: 50%; background: #2a3b4e; }
        #routes-root .term-bar span { margin-left: 14px; font-family: var(--mono); font-size: 22px; color: var(--ink-mute); }
        #routes-root .term-body { padding: 22px 28px; font-family: var(--mono); font-size: 22px; line-height: 1.5; color: var(--ink-soft); }
        #routes-root .ln { white-space: pre; }
        #routes-root .ln .cmd { color: var(--ink); }
        #routes-root .ln .pr { color: var(--c-opt); }
        #routes-root .ln .st { color: var(--c-data); font-weight: 700; }
        #routes-root .ln .ok { color: var(--c-opt); }
        #routes-root .ln .sec { color: var(--c-eval); }
        #routes-root .ln .done { color: var(--c-opt); font-weight: 700; }
        #routes-root .q {
          position: absolute; left: 1170px; top: 236px; width: 630px; height: 560px; border-radius: 14px;
          border: 2px solid var(--line); background: var(--panel); padding: 26px 28px;
        }
        #routes-root .q-h { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: 0.12em; color: var(--c-risk); }
        #routes-root .q-sub { margin-top: 8px; font-size: 24px; font-weight: 500; color: var(--ink-soft); }
        #routes-root .q-rows { position: relative; margin-top: 22px; }
        #routes-root .q-row { display: flex; align-items: center; height: 56px; font-family: var(--mono); font-size: 22px; }
        #routes-root .q-row .nm { width: 160px; color: var(--ink); }
        #routes-root .q-row .trk { position: relative; width: 226px; height: 18px; border-radius: 9px; background: rgba(178, 191, 204, 0.1); }
        #routes-root .q-row .fill { position: absolute; left: 0; top: 0; width: 226px; height: 18px; border-radius: 9px; background: var(--c-risk); transform-origin: left center; }
        #routes-root .q-row .pct { width: 98px; text-align: right; color: var(--c-risk); font-weight: 700; }
        #routes-root .q-row .cnt { width: 98px; text-align: right; color: var(--ink-mute); }
        #routes-root .gate-line { position: absolute; left: 305px; top: -6px; width: 3px; height: 402px; background: var(--c-opt); }
        #routes-root .gate-lab { position: absolute; left: 268px; top: 402px; font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--c-opt); white-space: nowrap; }
        #routes-root .cap {
          position: absolute; left: 120px; top: 830px; width: 1680px; font-size: 28px; color: var(--ink-soft);
        }
        #routes-root .cap b { color: var(--c-opt); }
        /* phase B */
        #routes-root .dq {
          position: absolute; left: 120px; top: 236px; width: 1680px; height: 700px; border-radius: 16px;
          border: 2px solid rgba(63, 216, 168, 0.5); background: rgba(12, 22, 32, 0.97); padding: 30px 44px;
          box-shadow: 0 30px 120px rgba(0, 0, 0, 0.6);
        }
        #routes-root .dq-h { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 22px; color: var(--ink-mute); letter-spacing: 0.06em; }
        #routes-root .dq-h b { color: var(--c-opt); font-weight: 700; }
        #routes-root .dq-row { display: flex; align-items: center; height: 60px; font-family: var(--mono); font-size: 23px; }
        #routes-root .dq-row .nm { width: 330px; font-family: var(--sans); font-size: 26px; font-weight: 600; color: var(--ink); }
        #routes-root .dq-row .inj { width: 120px; text-align: right; padding-right: 26px; color: var(--ink-mute); }
        #routes-root .dq-row .trk { position: relative; width: 980px; height: 26px; border-radius: 8px; background: rgba(178, 191, 204, 0.08); }
        #routes-root .dq-row .fill { position: absolute; left: 0; top: 0; width: 980px; height: 26px; border-radius: 8px; transform-origin: left center; }
        #routes-root .dq-row .base { position: absolute; left: 0; top: 30px; width: 980px; height: 6px; border-radius: 3px; background: #8a9aac; transform-origin: left center; }
        #routes-root .dq-row .pct { width: 150px; text-align: right; font-weight: 700; }
        #routes-root .key { display: flex; gap: 30px; margin-top: 10px; font-family: var(--mono); font-size: 22px; color: var(--ink-soft); }
        #routes-root .key span { display: flex; align-items: center; gap: 10px; }
        #routes-root .key i { display: block; width: 28px; border-radius: 3px; }
      </style>

      <div id="routes-root" data-composition-id="routes" data-width="1920" data-height="1080">
        <div class="scene" id="routes-in">
          <div class="eyebrow" data-layout-allow-overlap id="routes-eyebrow">06 · The system running</div>
          <div class="scene-title" data-layout-allow-overlap id="routes-title">One run: a raw folder to a green dbt build in 100 s.</div>
          <div class="scene-title" data-layout-allow-overlap id="routes-title2" style="opacity: 0">Defects caught, by type: seven at 100%, two well short.</div>
          <div class="scene-sub" id="routes-sub">Left: the real run log. Right: share of each table's rows held back; under the 5% line, the run goes on.</div>
          <div class="scene-sub" id="routes-sub2" style="opacity: 0">Recall = share of planted defects caught; a longer bar is better. One row per kind of defect.</div>

          <div id="routes-a">
            <div class="term" id="routes-term">
              <div class="term-bar"><i></i><i></i><i></i><span>make e2e · full-size drop</span></div>
              <div class="term-body" id="routes-log"></div>
            </div>
            <div class="q" id="routes-q">
              <div class="q-h">QUARANTINE PER TABLE</div>
              <div class="q-sub">% of rows held back · rows held</div>
              <div class="q-rows" id="routes-qrows">
                <div class="gate-line" id="routes-gline"></div>
                <div class="gate-lab" id="routes-glab">5% gate</div>
              </div>
            </div>
            <div class="cap" id="routes-cap">Every table stays under the 5% gate, so the run goes on. <b>dbt SQL and pandas quarantine the same 39,666 rows.</b></div>
          </div>

          <div class="dq" id="routes-dq">
            <div class="dq-h"><span>45,677 DEFECTS PLANTED AT KNOWN ROWS · 1.86M ROWS</span><span>overall recall <b>88.6%</b></span></div>
            <div id="routes-dqrows" style="margin-top: 14px"></div>
            <div class="key" id="routes-key">
              <span><i style="height: 16px; background: var(--c-opt)"></i>validation agent</span>
              <span><i style="height: 6px; background: #8a9aac"></i>hand-written checks, for comparison</span>
              <span style="margin-left: auto">grey number = defects planted</span>
            </div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = 14.0;
          const fmt = (v) => Math.round(v).toLocaleString("en-US");
          /* ---- data (outputs/metrics.json) ---- */
          const LOG = [
            '<span class="pr">$</span> <span class="cmd">pipeline-builder run --raw data/raw --out generated</span>',
            "",
            '<span class="st">DISCOVER </span>  <span class="ok">ok</span>  <span class="sec">38.67 s</span>  54 columns · 7 keys · 7 joins',
            '<span class="st">VALIDATE </span>  <span class="ok">ok</span>  <span class="sec">44.15 s</span>  136 rules',
            '<span class="st">BUILD    </span>  <span class="ok">ok</span>  <span class="sec"> 0.14 s</span>  39 dbt files · 88-line DAG',
            '<span class="st">LAND     </span>  <span class="ok">ok</span>  <span class="sec"> 5.93 s</span>  7 tables in warehouse.duckdb',
            '<span class="st">DBT_BUILD</span>  <span class="ok">ok</span>  <span class="sec">10.99 s</span>  31 models · 91 pass · 5 warn',
            "",
            '<span class="done">DONE</span>  raw → green build <span class="sec">99.9 s</span> · 0 tests failed',
            "",
            '<span class="pr">$</span> <span class="cmd">ls generated/</span>',
            "airflow/  catalog.yml  dbt/  rules.yml  run_state.json  warehouse.duckdb",
          ];
          const Q = [
            ["orders", 402000, 11507, 0.02862], ["order_items", 972645, 19452, 0.02], ["customers", 60300, 1200, 0.0199],
            ["payments", 405134, 7409, 0.01829], ["returns", 19575, 98, 0.00501], ["products", 4000, 0, 0], ["stores", 120, 0, 0],
          ];
          const DQ = [
            ["duplicate_row", 4316, 4316, 1.0, 1.0], ["null_required", 9179, 9179, 1.0, 1.0], ["orphan_fk", 6961, 6961, 1.0, 0],
            ["type_corruption", 6863, 6863, 1.0, 0], ["negative_value", 6879, 6879, 1.0, 0], ["future_date", 2300, 2300, 1.0, 0],
            ["malformed_email", 300, 300, 1.0, 0], ["invalid_enum", 4016, 2546, 0.634, 0], ["outlier_value", 4863, 1108, 0.2278, 0],
          ];
          /* ---- build DOM ---- */
          document.getElementById("routes-log").innerHTML = LOG.map((l, i) => '<div class="ln" id="routes-ln' + i + '">' + (l || " ") + "</div>").join("");
          const qr = document.getElementById("routes-qrows");
          Q.forEach(([n, rows, q, r], i) => qr.insertAdjacentHTML("beforeend",
            '<div class="q-row" id="routes-qr' + i + '"><div class="nm">' + n + '</div><div class="trk"><div class="fill" id="routes-qf' + i + '"></div></div>' +
            '<div class="pct">' + (r * 100).toFixed(2) + '%</div><div class="cnt">' + fmt(q) + "</div></div>"));
          const dr = document.getElementById("routes-dqrows");
          const PLAIN = { duplicate_row: "Duplicate row", null_required: "Missing required value", orphan_fk: "ID with no match",
            type_corruption: "Text in a number field", negative_value: "Negative amount", future_date: "Date in the future",
            malformed_email: "Broken email", invalid_enum: "Status or method typo", outlier_value: "Price inflated 100x" };
          DQ.forEach(([n, inj, c, r, b], i) => {
            const col = r >= 0.999 ? "var(--c-opt)" : r > 0.5 ? "var(--c-eval)" : "var(--c-risk)";
            dr.insertAdjacentHTML("beforeend",
              '<div class="dq-row" id="routes-dr' + i + '"><div class="nm">' + PLAIN[n] + '</div><div class="inj">' + fmt(inj) + "</div>" +
              '<div class="trk"><div class="fill" id="routes-df' + i + '" style="background:' + col + '"></div><div class="base" id="routes-db' + i + '"></div></div>' +
              '<div class="pct" style="color:' + col + '">' + (r * 100).toFixed(1) + "%</div></div>");
          });

          /* ---- phase A: the run ---- */
          tl.fromTo("#routes-in", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);
          tl.fromTo("#routes-eyebrow", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.1);
          tl.fromTo("#routes-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.2);
          tl.fromTo("#routes-sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.45);
          tl.fromTo("#routes-term", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.5);
          tl.fromTo("#routes-q", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.7);
          LOG.forEach((_, i) => tl.fromTo("#routes-ln" + i, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 1.0 + i * 0.36));
          // bars scale: the 5% gate sits at 145 px of the 226 px track
          const SCALE = 145 / 226 / 0.05;
          Q.forEach(([, , , r], i) => {
            tl.fromTo("#routes-qr" + i, { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.4 + i * 0.2);
            tl.fromTo("#routes-qf" + i, { scaleX: 0 }, { scaleX: r * SCALE, duration: 0.7, ease: "power3.out" }, 1.5 + i * 0.2);
          });
          tl.fromTo(["#routes-gline", "#routes-glab"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.2);
          tl.fromTo("#routes-cap", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.8);

          /* ---- phase B: defects caught by type ---- */
          const P2 = 7.4;
          tl.to("#routes-a", { opacity: 0, scale: 0.97, duration: 0.5, ease: "power2.inOut" }, P2); // fully out: no half-visible text behind the panel
          tl.to(["#routes-title", "#routes-sub"], { opacity: 0, duration: 0.3 }, P2);
          tl.fromTo("#routes-sub2", { opacity: 0 }, { opacity: 1, duration: 0.5 }, P2 + 0.5);
          tl.fromTo("#routes-title2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, P2 + 0.3);
          tl.fromTo("#routes-dq", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, P2 + 0.2);
          DQ.forEach(([, , , r, b], i) => {
            const at = P2 + 0.8 + i * 0.22;
            tl.fromTo("#routes-dr" + i, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, at);
            tl.fromTo("#routes-df" + i, { scaleX: 0 }, { scaleX: r, duration: 0.8, ease: "power3.out" }, at + 0.1);
            tl.fromTo("#routes-db" + i, { scaleX: 0 }, { scaleX: Math.max(b, 0.004), duration: 0.8, ease: "power3.out" }, at + 0.25);
          });
          tl.fromTo("#routes-key", { opacity: 0 }, { opacity: 1, duration: 0.4 }, P2 + 3.0);
          tl.to("#routes-in", { opacity: 0, duration: 0.4, ease: "power2.in" }, D - 0.8); // dip: fully out before the next scene starts
          window.__timelines["routes"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
