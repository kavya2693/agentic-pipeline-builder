<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>agentic-pipeline-builder demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* ================= THEME (shared by every scene) =================
         Layer colours are used consistently in every scene:
         data = blue · models = violet · optimizer = mint · evaluation = amber · risk = coral */
      :root {
        --bg: #0a1119;
        --panel: #0f1a26;
        --panel-2: #132131;
        --line: #24364a;
        --ink: #eef2f6;
        --ink-soft: #b2bfcc;
        --ink-mute: #8494a6;
        --c-data: #7fa8ff;
        --c-model: #b9a2ff;
        --c-opt: #3fd8a8;
        --c-opt-deep: #08795d;
        --c-eval: #f2c46d;
        --c-risk: #ff8a73;
        --sans: Inter, "Helvetica Neue", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      /* shared scene typography */
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .eyebrow {
        position: absolute;
        left: 120px;
        top: 78px;
        font-family: var(--mono);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--c-opt);
      }
      .scene-title {
        position: absolute;
        left: 120px;
        top: 118px;
        width: 1680px;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.12;
        color: var(--ink);
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="86"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html"
        data-start="0" data-duration="86" data-track-index="0" data-width="1920" data-height="1080"></div>

      <!-- scenes: one sub-composition per slide; 0.4 s overlaps are crossfades -->
      <div id="s01" data-composition-id="ctx" data-composition-src="compositions/s01-context.html"
        data-start="0" data-duration="7.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s02" data-composition-id="hook" data-composition-src="compositions/s02-hook.html"
        data-start="6.8" data-duration="4.8" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="s03" data-composition-id="explainer" data-composition-src="compositions/explainer.html" style="z-index: 5"
        data-start="11.3" data-duration="15" data-track-index="9" data-width="1920" data-height="1080"></div>
      <div id="s05" data-composition-id="arch" data-composition-src="compositions/s03-architecture.html"
        data-start="26" data-duration="14.6" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="s06" data-composition-id="routes" data-composition-src="compositions/s04-routes.html"
        data-start="40.2" data-duration="14" data-track-index="4" data-width="1920" data-height="1080"></div>
      <div id="s07" data-composition-id="value" data-composition-src="compositions/value.html" style="z-index: 5"
        data-start="53.9" data-duration="13" data-track-index="10" data-width="1920" data-height="1080"></div>
      <div id="s08" data-composition-id="results" data-composition-src="compositions/s05-results.html"
        data-start="66.6" data-duration="8.8" data-track-index="5" data-width="1920" data-height="1080"></div>
      <div id="s09" data-composition-id="twist" data-composition-src="compositions/s06-twist.html"
        data-start="75" data-duration="7" data-track-index="6" data-width="1920" data-height="1080"></div>
      <div id="s10" data-composition-id="endcard" data-composition-src="compositions/s07-end.html"
        data-start="81.6" data-duration="4.4" data-track-index="7" data-width="1920" data-height="1080"></div>

      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html" style="z-index: 6"
        data-start="0" data-duration="86" data-track-index="8" data-width="1920" data-height="1080"></div>
    </div>

    <script>
      // root timeline is empty: every scene, the background and the chrome are sub-compositions
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
