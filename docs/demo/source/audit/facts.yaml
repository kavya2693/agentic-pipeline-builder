# Extra check helpers (Python), available to check expressions.
helpers: |
  import re as _re
  import yaml as _yaml
  SHOWN = ['orders__pk__unique', 'orders__customer_id__not_null', 'orders__customer_id__references_customers',
           'orders__ordered_at__window', 'orders__order_total__type', 'orders__status__in_set']
  def Y(p):
      return _yaml.safe_load(T(p))
  def M():
      return J('outputs/metrics.json')
  def S():
      return J('outputs/stress.json')
  def _orders():
      return [x for x in M()['quarantine'] if x['table'] == 'orders'][0]
  def band_seconds():
      s = [e['seconds'] for e in M()['state_log'][:5]]
      return ' · '.join(['%.0f s' % s[0], '%.0f s' % s[1], '%.2f s' % s[2], '%.0f s' % s[3], '%.0f s' % s[4]])
  def quarantine_line():
      order = ['orders', 'order_items', 'customers', 'payments', 'returns', 'products', 'stores']
      q = {x['table']: x for x in M()['quarantine']}
      return ' · '.join('%s %.2f%% %s' % (t, 100 * q[t]['quarantine_rate'], format(q[t]['quarantined'], ',')) for t in order)
  def defect_line():
      order = ['duplicate_row', 'null_required', 'orphan_fk', 'type_corruption', 'negative_value', 'future_date',
               'malformed_email', 'invalid_enum', 'outlier_value']
      b = M()['dq']['agent']['by_defect']
      return ' · '.join('%s %s %.1f%%' % (k, format(b[k]['injected'], ','), 100 * b[k]['recall']) for k in order)
  def explainer_bars_match():
      html = T('demo:compositions/explainer.html')
      s = S()
      want = [s['sweep']['0.005']['dq_recall'], s['frozen_contract']['0.005']['dq_recall'],
              s['sweep']['0.02']['dq_recall'], s['frozen_contract']['0.02']['dq_recall']]
      got = [float(x) for x in _re.findall(r'scaleX: (0\.\d{4})', html)]
      return [round(w, 4) for w in want] == got
  def boxes_exist():
      mods = ('orchestrator', 'discovery', 'validation', 'describe', 'builder', 'sql', 'runtime', 'dbt_run', 'evaluate')
      ok = all(len(T('src/pipeline_builder/%s.py' % m)) > 0 for m in mods)
      return ok and grep('README.md', r'data/ground_truth') and grep('src/pipeline_builder/orchestrator.py', r'run_state\.json') and grep('src/pipeline_builder/runtime.py', r'def land_frame')
  def orders_line():
      q = _orders()
      return '%s of %s (%.2f%%)' % (format(q['quarantined'], ','), format(q['rows'], ','), 100 * q['quarantined'] / q['rows'])
  def clean_orders():
      q = _orders()
      n = q['rows'] - q['quarantined']
      return n if n == M()['marts']['fct_orders'] else -1
  def more_line():
      committed = [r for r in Y('examples/rules.yml')['rules'] if r['table'] == 'orders']
      exported = [r for r in J('demo:assets/contract_sheet.json')['rules'] if r['id'] not in SHOWN]
      if len(committed) != len(exported) + len(SHOWN):
          return 'mismatch'
      return '%d more (%d flag no rows)' % (len(exported), sum(r['rows_flagged'] == 0 for r in exported))
  def typos_in_value_set():
      r = [r for r in Y('examples/rules.yml')['rules'] if r['id'] == 'orders__status__in_set'][0]
      vs = r['kwargs']['value_set']
      return {'cancel', 'pending_x'} <= set(vs) and len(vs) == 7 and grep('README.md', r'`cancel`, `pending_x`')
  def sheet_rows_match():
      """The SHEET block injected in value.html must equal the exported contract sheet and the committed rules."""
      html = T('demo:compositions/value.html')
      m = _re.search(r"const SHEET = (\{.*?\}); /\* SHEET:END", html, _re.S)
      sheet = json.loads(m.group(1))
      src = {r['id']: r for r in J('demo:assets/contract_sheet.json')['rules']}
      committed = {r['id']: r for r in Y('examples/rules.yml')['rules']}
      if [r['id'] for r in sheet['rows_shown']] != SHOWN:
          return False
      for r in sheet['rows_shown']:
          s = src[r['id']]
          if r['held'] != s['rows_flagged'] or r['evidence'] != s['evidence'] or r['severity'] != s['severity']:
              return False
          if committed[r['id']]['evidence'] != s['evidence']:
              return False
      q = _orders()
      return sheet['quarantined'] == q['quarantined'] and sheet['rows'] == q['rows']
