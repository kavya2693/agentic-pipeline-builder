  - {id: F-12, slides: ["03"], label: "Outcome badges: every type right, bad rows caught, dbt build green", shown: "every type right / bad rows caught / dbt build green", type: derived, source: "outputs/metrics.json", key: "schema.types.agent, quarantine, dbt", formula: "agent types correct == total; quarantined rows > 0; dbt.ok and no failed tests",
     check: {expr: "(lambda m: m['schema']['types']['agent']['correct'] == m['schema']['types']['agent']['total'] and sum(q['quarantined'] for q in m['quarantine']) > 0 and m['dbt']['ok'] and m['dbt']['failed'] == [])(M())", fmt: bool}}
