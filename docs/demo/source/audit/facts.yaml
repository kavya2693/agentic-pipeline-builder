# Audit facts for the agentic-pipeline-builder demo video.
# Read by docs/demo/source/tools/build_audit_report.py (paths below are relative to this file).
#
# Check expressions are Python, evaluated with these helpers (paths relative to the repo root;
# a "demo:" prefix means relative to the demo project folder):
#   R(path) -> pandas DataFrame from CSV      J(path) -> parsed JSON
#   row(path, **eq) -> the single CSV row matching all equalities (a pandas Series)
#   T(path) -> file text                      grep(path, regex) -> True/False
#   plus the helpers defined at the bottom of this file (Y, M, S, ...)
# A check passes when fmt.format(value) == expect (or, with fmt "bool", when value is True).
# Only committed files are read (outputs/, examples/, src/, README.md); data/ and generated/ are gitignored.

project:
  name: agentic-pipeline-builder
  title: "agentic-pipeline-builder: demo video audit report"
  repo_url: https://github.com/kavya2693/agentic-pipeline-builder
  repo_dir: ../../../..
  demo_dir: ..
  demo_display: docs/demo/source
  out_dir: ../..
  video: docs/demo/demo.mp4
  video_duration_s: 86.0
  outputs_dir: outputs
  venv_python: .venv/bin/python
  version_packages: [pandas, numpy, duckdb, yaml, pyarrow]
  regenerate:
    - "make e2e                                   # data/raw + answer key, then discover, validate, build, dbt build, score -> outputs/metrics.json, report.md"
    - "make stress                                # outputs/stress.json, stress.md (10%-scale defect-rate sweep)"
    - "PYTHONPATH=src .venv/bin/python docs/demo/source/tools/export_contract_sheet.py docs/demo/source/assets/contract_sheet.json"
    - "python3 docs/demo/source/tools/inject_contract.py docs/demo/source/assets/contract_sheet.json docs/demo/source/compositions/value.html --rules orders__pk__unique,orders__customer_id__not_null,orders__customer_id__references_customers,orders__ordered_at__window,orders__order_total__type,orders__status__in_set"
    - "cd docs/demo/source && npx --yes hyperframes@0.8.156 check && npx --yes hyperframes@0.8.156 render -f 30 -q looks -o renders/agentic-pipeline-builder-master.mp4 && cd -"
    - "ffmpeg -y -i docs/demo/source/renders/agentic-pipeline-builder-master.mp4 -c:v libx264 -preset slow -crf 25 -pix_fmt yuv420p -movflags +faststart -an docs/demo/demo.mp4"
    - "python3 docs/demo/source/tools/build_audit_report.py docs/demo/source/audit/facts.yaml   # stills, checks, MD/DOCX/PDF"
  seeds: {data_seed: 7, stress_baseline_seed: 3, defect_rate: 0.005, as_of: "2026-02-01"}
  run_time: "metrics.json seconds_raw_to_built = 99.9 s for the pipeline run (data generation not included); the contract-sheet export re-runs discovery + validation in about 40 s"

assumptions:
  - id: A-01
    statement: "All data is synthetic: a seeded generator writes a regional retailer's nightly drop (60k customers, 400k orders, 973k order lines, 405k payments, 20k returns, 4,000 products, 120 stores). The generator and the inference rules were written by the same person, so 100% type accuracy is an upper bound, not evidence that the rules generalise."
    source: "scripts/generate_data.py:14-18 (scale 1.0, seed 7); src/pipeline_builder/datagen.py; README 'The data'"
    figures: []
    all_figures: true
    edit: ["src/pipeline_builder/datagen.py", "scripts/generate_data.py"]
    rerun: ["make e2e", "make stress"]
  - id: A-02
    statement: "Defects are planted at 0.5% of rows per defect type (nine types) at known rows; the answer key in data/ground_truth holds every type, key, relationship and defect."
    source: "scripts/generate_data.py:15 (--defect-rate 0.005); README 'The data'"
    figures: [F-05, F-08, F-36, F-37, F-38, F-50, F-51, F-52]
    edit: ["scripts/generate_data.py:15"]
    rerun: ["make e2e"]
  - id: A-03
    statement: "The drop is judged as of 2026-02-01: date-window rules reject dates after the run date."
    source: "Makefile:4 (AS_OF ?= 2026-02-01); validation.py (date window rule)"
    figures: [F-34, F-36, F-39, F-40]
    edit: ["Makefile:4"]
    rerun: ["make e2e", "export_contract_sheet.py + inject_contract.py"]
  - id: A-04
    statement: "Quarantine gate: the run halts before building if any table would quarantine more than 5% of its rows."
    source: "src/pipeline_builder/orchestrator.py:35 (max_quarantine_rate = 0.05), :143 (too_many_rejects -> HALTED); cli.py:201"
    figures: [F-10, F-34, F-44]
    edit: ["src/pipeline_builder/orchestrator.py:35 or --max-quarantine-rate"]
    rerun: ["make e2e"]
  - id: A-05
    statement: "Profiler tolerances sit near 1%: a type needs 98% of values to parse, a required column at most 1% nulls, a key 99% distinct and at most 1% nulls, a non-negative column 99% non-negative, a category at least 0.1% of rows; outliers are flagged above 10x the p99."
    source: "src/pipeline_builder/discovery.py:27, :30-31, :33; validation.py:25, :28, :31, :33"
    figures: [F-03, F-20, F-29, F-36, F-47, F-13, F-14, F-58, F-61]
    edit: ["src/pipeline_builder/discovery.py:27-35", "src/pipeline_builder/validation.py:25-36"]
    rerun: ["make e2e", "make stress"]
  - id: A-06
    statement: "Retry policy: only DBT_BUILD and LAND are retried (2 attempts each); a rule that fails on the data fails the same way twice."
    source: "src/pipeline_builder/orchestrator.py:153 (MAX_ATTEMPTS)"
    figures: [F-11]
    edit: ["src/pipeline_builder/orchestrator.py:153"]
    rerun: ["make e2e"]
  - id: A-07
    statement: "Timings are wall-clock seconds from one run on the author's laptop and vary with the machine and its load."
    source: "outputs/metrics.json state_log, seconds_raw_to_built; README 'The result'"
    figures: [F-18, F-19, F-30]
    edit: ["-"]
    rerun: ["make e2e"]
  - id: A-08
    statement: "Stress runs are at 10% scale (about 40,000 orders) with defect rates 0.5%, 2%, 5%, 10% per type (seed 7); the frozen contract is learned once on a separate 0.5% drop (seed 3) and enforced unchanged."
    source: "scripts/stress_defect_rate.py:93, :99-103; outputs/stress.md"
    figures: [F-13, F-14, F-15, F-16, F-17, F-58, F-59, F-60, F-62]
    edit: ["scripts/stress_defect_rate.py:93-103"]
    rerun: ["make stress"]
  - id: A-09
    statement: "Scoring: a defect is caught when a rule flags its row on its column (a duplicate row by any uniqueness rule). Row precision = flagged rows that carry any planted defect / all flagged rows."
    source: "src/pipeline_builder/evaluate.py:143-183 (score_flags)"
    figures: [F-36, F-37, F-38, F-50, F-51, F-52, F-13, F-14, F-15, F-16, F-58, F-59]
    edit: ["src/pipeline_builder/evaluate.py:143"]
    rerun: ["make e2e", "make stress"]
  - id: A-10
    statement: "The 'hand-written first pass' baseline is every column required plus the first column unique."
    source: "src/pipeline_builder/validation.py:276 (naive_rules)"
    figures: [F-38, F-50, F-52]
    edit: ["src/pipeline_builder/validation.py:276"]
    rerun: ["make e2e"]
  - id: A-11
    statement: "The local LLM (Ollama) is off by default and only words column descriptions; types, keys, rules and SQL are deterministic code. The headline run did not use it (descriptions.model_leads = 0)."
    source: "src/pipeline_builder/describe.py:1-7; cli.py:141, :203; outputs/metrics.json descriptions"
    figures: [F-28]
    edit: ["--llm flag"]
    rerun: ["uv run pipeline-builder run ... --llm llama3.2"]
  - id: A-12
    statement: "Video rounding: percentages to 1 decimal (the type-accuracy card to 0), seconds to whole numbers on slides 05 and 08 (BUILD 0.14 s kept) and 2 decimals in the slide 06 log; 1.86M = 1,863,774 rows."
    source: "this audit (display convention)"
    figures: [F-04, F-18, F-19, F-36, F-37, F-47, F-48, F-50, F-51, F-52]
    edit: ["the composition file named on each slide"]
    rerun: ["hyperframes render"]
  - id: A-13
    statement: "Slide 01 (industry, everyday problems) is general data-engineering knowledge used as context, echoed by the README's problem statement. It is not a result of this repo and carries no numbers."
    source: "author's framing; README 'The problem', 'Why it is hard'"
    figures: [F-01, F-02]
    edit: ["compositions/s01-context.html"]
    rerun: ["hyperframes render"]
  - id: A-14
    statement: "Slide 07's scene is schematic: the row tokens are illustrative (every 11th goes to quarantine); the counters, the contract rows and the ringed values come from the export. 'cancel' and 'pending_x' are typos learned as allowed values (README 'Known limitations')."
    source: "compositions/value.html CONFIG; README 'Known limitations'"
    figures: [F-39, F-41, F-43]
    edit: ["compositions/value.html (CONFIG)"]
    rerun: ["hyperframes render"]

figures:
  # ---- slide 01
  - {id: F-01, slides: ["01"], label: "Who relates: retail & e-commerce data teams, analytics engineers, data platform & integration", shown: "3 chips", type: general-knowledge, source: "author's framing", key: "-", formula: "-", manual: "Context statement, not a repo output."}
  - {id: F-02, slides: ["01"], label: "Four everyday problems (days per source; types guessed wrong; status typo becomes a category; common mess looks normal)", shown: "4 problem cards", type: general-knowledge, source: "README 'The problem', 'Why it is hard'", key: "README lines 16-34", formula: "-",
     check: {expr: "grep('README.md', r'takes days per source') and grep('README.md', r'status typo that becomes its own category') and grep('README.md', r'common enough looks normal') and grep('README.md', r'postal_code. is text')", fmt: bool}}
  # ---- slide 02
  - {id: F-03, slides: ["02", "05", "08"], label: "Source files in the drop", shown: "7 files", type: direct, source: "examples/catalog.yml", key: "tables", formula: "count of tables",
     check: {expr: "len(Y('examples/catalog.yml')['tables'])", fmt: "{:d}", expect: "7"}}
  - {id: F-04, slides: ["02", "05", "06", "08"], label: "Rows in the full-size drop", shown: "1.86M rows", type: derived, source: "outputs/metrics.json", key: "quarantine[*].rows", formula: "60,300 + 972,645 + 402,000 + 405,134 + 4,000 + 19,575 + 120 = 1,863,774",
     check: {expr: "sum(q['rows'] for q in M()['quarantine']) / 1e6", fmt: "{:.2f}M", expect: "1.86M"}}
  - {id: F-05, slides: ["02", "06", "08"], label: "Planted defects", shown: "45,677 planted defects", type: direct, source: "outputs/metrics.json", key: "dq.agent.injected", formula: "-",
     check: {expr: "M()['dq']['agent']['injected']", fmt: "{:,d}", expect: "45,677"}}
  - {id: F-06, slides: ["02"], label: "File formats in the drop", shown: "csv · json · jsonl · parquet", type: direct, source: "examples/catalog.yml", key: "tables[*].file extensions", formula: "set of extensions",
     check: {expr: "' · '.join(sorted({t['file'].rsplit('.', 1)[1] for t in Y('examples/catalog.yml')['tables'].values()}))", fmt: "{}", expect: "csv · json · jsonl · parquet"}}
  - {id: F-07, slides: ["02"], label: "Two date formats in one column", shown: "two date formats in one column", type: direct, source: "examples/catalog.yml", key: "customers.signup_date formats ['%m/%d/%Y', '%Y-%m-%d']", formula: "-",
     check: {expr: "len([c for c in Y('examples/catalog.yml')['tables']['customers']['columns'] if c['name'] == 'signup_date'][0]['formats'])", fmt: "{:d}", expect: "2"}}
  - {id: F-08, slides: ["02"], label: "Defect types planted", shown: "9 defect types at known rows", type: direct, source: "outputs/metrics.json", key: "dq.agent.by_defect", formula: "count of keys",
     check: {expr: "len(M()['dq']['agent']['by_defect'])", fmt: "{:d}", expect: "9"}}
  # ---- slide 03
  - {id: F-09, slides: ["03", "05"], label: "One state machine: discover, validate, build, land, dbt build", shown: "ONE STATE MACHINE / orchestrator.py band", type: direct, source: "src/pipeline_builder/orchestrator.py:131-148", key: "STATES, TRANSITIONS", formula: "-",
     check: {expr: "all(grep('src/pipeline_builder/orchestrator.py', '\"%s\": %s_state' % (s, f)) for s, f in [('DISCOVER', 'discover'), ('VALIDATE', 'validate'), ('BUILD', 'build'), ('LAND', 'land'), ('DBT_BUILD', 'dbt')])", fmt: bool}}
  - {id: F-10, slides: ["03", "05"], label: "Gate: too many bad rows stops the run (> 5% of any table)", shown: "too many bad rows? stop / quarantine > 5%? any table / HALTED", type: direct, source: "src/pipeline_builder/orchestrator.py:35, :93-95, :143", key: "max_quarantine_rate = 0.05; too_many_rejects -> HALTED", formula: "-",
