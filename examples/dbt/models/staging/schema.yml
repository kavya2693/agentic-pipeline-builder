    - accepted_values:
        arguments:
          values:
          - apparel
          - beauty
          - electronics
          - grocery
          - home
          - household
          - sports
          - toys
  - name: list_price
    description: Decimal.
    data_tests:
    - not_null
  - name: launched_on
    description: 'Date. Source formats: %Y-%m-%d.'
    data_tests:
    - not_null
  - name: is_active
    description: Boolean.
    data_tests:
    - not_null
  - name: weight_kg
    description: Decimal. Empty in 14% of source rows.
  - name: attributes_brand
    description: 'String. One of: aster, borealis, cedar, dune, ember, falcon, garnet, harbor, iris, juniper. Standardised
      to lower case.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - aster
          - borealis
          - cedar
          - dune
          - ember
          - falcon
          - garnet
          - harbor
          - iris
          - juniper
  - name: attributes_color
    description: 'String. One of: beige, black, blue, green, grey, red, white. Empty in 13% of source rows. Standardised
