- name: stg_returns__rejected
  description: Quarantined rows of returns.jsonl and the rule ids they failed.
- name: stg_returns__checked
  description: Every row of returns.jsonl, parsed, with failed and warned rule ids.
- name: stg_stores
  description: '120 source rows from stores.csv. Key: store_id.'
  columns:
  - name: store_id
    description: String. Primary key.
    data_tests:
