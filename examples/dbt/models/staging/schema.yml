- name: stg_products__rejected
  description: Quarantined rows of products.json and the rule ids they failed.
- name: stg_products__checked
  description: Every row of products.json, parsed, with failed and warned rule ids.
- name: stg_returns
  description: '19,575 source rows from returns.jsonl. Key: return_id. Points to orders, products.'
  columns:
  - name: return_id
    description: Integer. Primary key.
    data_tests:
    - unique
    - not_null
  - name: order_id
    description: Integer. References orders.order_id.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
        config:
          severity: warn
  - name: sku
    description: String. References products.sku.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_products')
