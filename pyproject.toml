[project]
name = "pipeline-builder"
version = "0.1.0"
description = "Raw source files in, a validated and tested dbt + Airflow pipeline out, built by discovery, validation and builder agents"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.scripts]
pipeline-builder = "pipeline_builder.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_builder"]

[tool.ruff]
line-length = 110
target-version = "py311"
# Generated output kept for readers; it is produced by the builder, not edited by hand.
extend-exclude = ["examples", "generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
